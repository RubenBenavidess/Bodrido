services:
  postgres:
    image: postgres:15-alpine
    container_name: fleetservice_postgres
    environment:
      POSTGRES_USER: fleetUser
      POSTGRES_PASSWORD: fleetPass123
      POSTGRES_DB: FleetDB
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fleet_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fleetservice_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - fleet_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  fleetservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetservice_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5433;Database=FleetDB;Username=fleetUser;Password=fleetPass123"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ../src/keys:/app/Keys:ro
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - fleet_network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  fleet_network:
    driver: bridge
