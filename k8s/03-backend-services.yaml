apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: auth-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 4000
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "4000"
        - name: DB_HOST
          value: auth-db
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          value: admin123
        - name: DB_NAME
          value: logiflow_auth
        - name: RABBITMQ_HOST
          value: rabbitmq
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          value: guest
        - name: RABBITMQ_PASSWORD
          value: guest
        - name: PRIVATE_KEY_PATH
          value: /app/keys/ec_private.pem
        - name: PUBLIC_KEY_PATH
          value: /app/keys/ec_public.pem
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
  - port: 4000
    targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-service
spec:
  selector:
    matchLabels:
      app: fleet-service
  template:
    metadata:
      labels:
        app: fleet-service
    spec:
      containers:
      - name: fleet-service
        image: fleet-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ConnectionStrings__DefaultConnection
          value: "Host=fleet-db;Port=5432;Database=FleetDB;Username=fleetUser;Password=fleetPass123"
        - name: Jwt__PublicKeyPath
          value: "/app/Keys/ec_public.pem"
        - name: RabbitMQ__HostName
          value: rabbitmq
        - name: RabbitMQ__UserName
          value: guest
        - name: RabbitMQ__Password
          value: guest
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-service
spec:
  selector:
    app: fleet-service
  ports:
  - port: 8080
    targetPort: 8080
---
