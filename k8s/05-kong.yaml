apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
data:
  kong.yml: |
    _format_version: "3.0"
    services:
      - name: auth-service
        url: http://auth-service:4000/auth
        routes:
          - name: auth-route
            paths:
              - /api/auth
            strip_path: true
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              policy: local

      - name: fleet-service
        url: http://fleet-service:8080
        routes:
          - name: fleet-route
            paths:
              - /api/fleet
            strip_path: true
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              policy: local

      - name: order-service
        url: http://order-service:8080
        routes:
          - name: order-route
            paths:
              - /api/orders
            strip_path: true
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              policy: local

      - name: billing-service
        url: http://billing-service:8081
        routes:
          - name: billing-route
            paths:
              - /api/billing
            strip_path: true
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              policy: local

      - name: notification-service
        url: http://notification-service:8082
        routes:
          - name: notification-route
            paths:
              - /api/notification
            strip_path: true
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              policy: local

      - name: graphql-bff
        url: http://graphql-bff:4001
        routes:
          - name: graphql-route
            paths:
              - /api/graphql
            strip_path: true
        plugins:
          - name: rate-limiting
            config:
              minute: 200
              policy: local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
spec:
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
      - name: kong
        image: kong:latest
        ports:
        - containerPort: 8000
          name: proxy
        - containerPort: 8001
          name: admin
        env:
        - name: KONG_DATABASE
          value: "off"
        - name: KONG_DECLARATIVE_CONFIG
          value: /usr/local/kong/declarative/kong.yml
        - name: KONG_PROXY_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_ADMIN_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_PROXY_ERROR_LOG
          value: /dev/stderr
        - name: KONG_ADMIN_ERROR_LOG
          value: /dev/stderr
        - name: KONG_ADMIN_LISTEN
          value: 0.0.0.0:8001
        volumeMounts:
        - name: kong-config
          mountPath: /usr/local/kong/declarative/kong.yml
          subPath: kong.yml
          readOnly: true
      volumes:
      - name: kong-config
        configMap:
          name: kong-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong
spec:
  type: LoadBalancer
  selector:
    app: kong
  ports:
  - port: 8000
    targetPort: 8000
    name: proxy
  - port: 8001
    targetPort: 8001
    name: admin
