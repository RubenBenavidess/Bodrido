server:
  port: 8080

spring:
  application:
    name: order-ms
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bodrido_orders_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq: 
    host: ${DB_HOST:localhost}
    port: ${RABBIT_PORT:5432}
    username: ${RABBIT_USER:admin}
    password: ${RABBIT_PASSWORD:admin}
    connection-timeout: 5000  


jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:file:/app/keys/ec_public.pem} # Ruta a la llave pública